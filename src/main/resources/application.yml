server:
  port: 8080

spring:
  application:
    name: mini-payment
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://124.222.192.3:3306/mini_payment?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 8ik9ol000
  data:
    redis:
      host: 124.222.192.3
      port: 6379
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id

app:
  order:
#    订单过期时间给30分钟
    expire-minutes: 30
  payment:
#    支付过期时间给15分钟
    expire-minutes: 15
  recon:
    bill-dir: ./recon-bills
  channel:
    # mock 渠道：模拟微信/支付宝的支付创建与回调
    mock:
      enabled: true

rocketmq:
  name-server: 192.168.200.128:9876
  producer-group: mini-payment-producer
  consumer-group: mini-payment-consumer
  topic: MINI_PAYMENT_EVENT

xxl:
  job:
    # XXL-JOB 调度中心地址；accessToken 按调度中心实际配置填写，未配置则留空
    admin-addresses: http://192.168.200.128:8082/xxl-job-admin
    access-token: default_token
    appname: mini-payment-executor
    ip:
    port: 9998
    log-path: ./logs/xxl-job/jobhandler/
    log-retention-days: 30
